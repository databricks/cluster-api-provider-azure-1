name: Lint Documentation
on:
  push:
    paths:
      - "**.md"
    branches:
      - main
  pull_request:
    paths: "**.md"
jobs:
  markdown-link-check:
    name: Broken Links
    runs-on: 
      group: ubuntu-runners
      labels: ubuntu-20.04-16core
    steps:
    - uses: actions/checkout@master
    - uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: .markdownlinkcheck.json
